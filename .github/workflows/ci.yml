# MNT-1: CI for the dashboard UI — lint and test as a gate on every push/PR.
# DX-8: quality:check step added — runs TypeScript strict type-check + oxlint (warn-mode; no-blocking).
name: UI CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: npm
    - name: Install dependencies
      run: npm ci
    - name: Lint
      run: npm run lint
    # DX-8: TypeScript compile + oxlint, now a REAL gate.
    #
    # This step was `|| true`, described as temporary while violations were addressed. The suppression
    # was in fact hiding a script that could never pass: `quality:check` ran `tsc -b --noEmit`, an
    # invalid flag combination (TS5094 "'--noEmit' may not be used with '--build'"). So the type check
    # had never run — on any PR, ever — and `|| true` made that indistinguishable from success.
    # Script fixed to `tsc -b && oxlint`; the suppression is no longer needed and no longer wanted.
    - name: Quality check (TypeScript + oxlint)
      run: npm run quality:check
    - name: Test
      run: npm test
    # The production build was never run in CI, so a change could break `tsc -b && vite build` and
    # still show a green tick — lint and one vitest file cannot see a broken bundle. This matters most
    # for dependency bumps: a TypeScript or Tailwind major can pass lint and tests while leaving the
    # app uncompilable or unstyled.
    - name: Build
      run: npm run build
    # SEC-5: dependency CVE visibility — report-only (does not fail the build). Ratchet to blocking
    # once the backlog is triaged (FI-SEC5-A). `|| true` keeps it non-blocking.
    - name: Dependency audit (report-only)
      run: npm audit --audit-level=high || true
