# MNT-1: CI for the dashboard UI — lint and test as a gate on every push/PR.
# DX-8: quality:check step added — runs TypeScript strict type-check + oxlint (warn-mode; no-blocking).
name: UI CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '20'
        cache: npm
    - name: Install dependencies
      run: npm ci
    - name: Lint
      run: npm run lint
    # DX-8: Full quality gate — TypeScript compile + oxlint (strengthened rules: no-console, no-any warn)
    # Uses `|| true` to keep non-blocking while teams address existing violations.
    # Remove `|| true` once violations are resolved to make this a hard gate.
    - name: Quality check (TypeScript + oxlint)
      run: npm run quality:check || true
    - name: Test
      run: npm test
    # SEC-5: dependency CVE visibility — report-only (does not fail the build). Ratchet to blocking
    # once the backlog is triaged (FI-SEC5-A). `|| true` keeps it non-blocking.
    - name: Dependency audit (report-only)
      run: npm audit --audit-level=high || true
